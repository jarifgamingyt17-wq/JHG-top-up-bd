<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JHG Top-Up BD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; padding: 15px; display: flex; justify-content: center; }
        .wrapper { max-width: 450px; width: 100%; }
        
        .header { background: linear-gradient(135deg, #1e1b4b, #312e81); padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 15px; border: 1px solid #4338ca; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); }
        .header h1 { font-size: 22px; color: #38bdf8; margin-bottom: 5px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        .header p { font-size: 13px; color: #cbd5e1; }

        .card { background-color: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 18px; margin-bottom: 15px; }
        .card-title { font-size: 15px; font-weight: 600; color: #f59e0b; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

        .payment-box { background: rgba(236, 72, 153, 0.1); border: 1px dashed #ec4899; padding: 12px; border-radius: 10px; text-align: center; font-size: 14px; margin-bottom: 15px; }
        .payment-box strong { color: #f472b6; font-size: 16px; }

        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        .input-group input, .input-group select { width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        .input-group input:focus { border-color: #3b82f6; }

        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .option-card { background: #1f2937; border: 2px solid #374151; padding: 12px; border-radius: 10px; text-align: center; cursor: pointer; transition: all 0.2s ease; }
        .option-card.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.15); box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }
        .option-title { font-size: 13px; font-weight: bold; color: #38bdf8; }
        .option-price { font-size: 12px; color: #10b981; margin-top: 4px; font-weight: 600; }

        .btn-submit { width: 100%; background: linear-gradient(135deg, #10b981, #059669); color: #fff; font-weight: bold; padding: 14px; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-submit:hover { background: linear-gradient(135deg, #059669, #047857); }

        .footer { text-align: center; font-size: 11px; color: #64748b; margin-top: 20px; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <h1>JHG Top-Up BD</h1>
        <p>১০০% ট্রাস্টেড ও দ্রুত গেম টপ-আপ সার্ভিস</p>
    </div>

    <div class="card">
        <div class="payment-box">
            bKash Personal:<br>
            <strong>01781511654</strong>
        </div>

        <div class="input-group">
            <label for="playerId">Player UID / ID</label>
            <input type="number" id="playerId" placeholder="উদাহরণ: 123456789" required>
        </div>

        <div class="card-title">💎 ডায়মন্ড ও মেম্বারশিপ প্যাকেজ বেছে নিন</div>
        <div class="grid-options" id="packageGrid">
            <div class="option-card" onclick="selectPackage(this, '115 Diamond', '80 BDT')">
                <div class="option-title">115 Diamond</div>
                <div class="option-price">80 BDT</div>
            </div>
            <div class="option-card" onclick="selectPackage(this, '240 Diamond', '160 BDT')">
                <div class="option-title">240 Diamond</div>
                <div class="option-price">160 BDT</div>
            </div>
            <div class="option-card" onclick="selectPackage(this, '610 Diamond', '400 BDT')">
                <div class="option-title">610 Diamond</div>
                <div class="option-price">400 BDT</div>
            </div>
            <div class="option-card" onclick="selectPackage(this, 'Weekly Membership', '120 BDT')">
                <div class="option-title">Weekly Membership</div>
                <div class="option-price">120 BDT</div>
            </div>
            <div class="option-card" onclick="selectPackage(this, 'Monthly Membership', '650 BDT')">
                <div class="option-title">Monthly Membership</div>
                <div class="option-price">650 BDT</div>
            </div>
        </div>

        <div class="input-group">
            <label for="paymentMethod">পেমেন্ট মেথড</label>
            <select id="paymentMethod" required>
                <option value="Bkash">bKash Personal</option>
            </select>
        </div>

        <div class="input-group">
            <label for="trxId">Transaction ID (TrxID)</label>
            <input type="text" id="trxId" placeholder="টাকা পাঠানোর পর TrxID দিন" required>
        </div>

        <button type="button" class="btn-submit" onclick="sendOrder()">WhatsApp-এ অর্ডার করুন</button>
    </div>

    <div class="footer">
        © 2026 JHG Top-Up BD. All rights reserved.
    </div>
</div>

<script>
    let selectedPkgName = "";
    let selectedPkgPrice = "";

    function selectPackage(element, name, price) {
        let cards = document.querySelectorAll('.option-card');
        cards.forEach(card => card.classList.remove('active'));
        element.classList.add('active');
        selectedPkgName = name;
        selectedPkgPrice = price;
    }

    function sendOrder() {
        var playerId = document.getElementById('playerId').value;
        var paymentMethod = document.getElementById('paymentMethod').value;
        var trxId = document.getElementById('trxId').value;
        var whatsappNumber = "8801314983419";

        if(!playerId) {
            alert("অনুগ্রহ করে আপনার Player ID লিখুন!");
            return;
        }
        if(!selectedPkgName) {
            alert("অনুগ্রহ করে একটি প্যাকেজ সিলেক্ট করুন!");
            return;
        }
        if(!trxId) {
            alert("অনুগ্রহ করে Transaction ID (TrxID) দিন!");
            return;
        }

        var message = "Hello! New Top-Up Order:%0A" +
                      "- Player ID: " + playerId + "%0A" +
                      "- Package: " + selectedPkgName + " (" + selectedPkgPrice + ")%0A" +
                      "- Payment: " + paymentMethod + "%0A" +
                      "- TrxID: " + trxId;

        var url = "https://wa.me/" + whatsappNumber + "?text=" + message;
        window.open(url, '_blank');
    }
</script>

</body>
</html>
