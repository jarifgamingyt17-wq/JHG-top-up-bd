
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JHG Top-Up BD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        header {
            background: linear-gradient(135deg, #1e1b4b, #4338ca);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #38bdf8;
            font-size: 26px;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #cbd5e1;
            font-size: 14px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e293b;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            text-align: left;
        }
        .card h2 {
            color: #f59e0b;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        .payment-box {
            background-color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e2136e;
            margin-bottom: 15px;
            text-align: center;
        }
        .payment-box strong {
            color: #e2136e;
            font-size: 16px;
        }
        .pack-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .pack-item {
            background-color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            text-align: center;
        }
        .pack-item strong {
            display: block;
            color: #38bdf8;
            font-size: 16px;
        }
        .pack-item span {
            color: #22c55e;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-order {
            display: block;
            width: 100%;
            background-color: #25d366;
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }
        footer {
            margin-top: 30px;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>JHG Top-Up BD</h1>
            <p class="subtitle">১০০% ট্রাস্টেড ও দ্রুত গেইম টপ-আপ সার্ভিস</p>
        </header>

        <div class="card">
            <!-- বিকাশ নম্বর -->
            <div class="payment-box">
                <strong>bKash Personal: 01781511654</strong>
            </div>

            <h2>Free Fire Diamond (In-Game / UID)</h2>
            <div class="pack-grid">
                <div class="pack-item">
                    <strong>115 Diamond</strong>
                    <span>80 BDT</span>
                </div>
                <div class="pack-item">
                    <strong>240 Diamond</strong>
                    <span>160 BDT</span>
                </div>
                <div class="pack-item">
                    <strong>610 Diamond</strong>
                    <span>400 BDT</span>
                </div>
                <div class="pack-item">
                    <strong>Weekly Membership</strong>
                    <span>160 BDT</span>
                </div>
            </div>
            
            <!-- হোয়াটসঅ্যাপ বাটন লিংক -->
            <a href="https://wa.me/8801781511654?text=Hello,%20I%20want%20to%20top-up" class="btn-order" target="_blank">WhatsApp-এ অর্ডার করুন</a>
        </div>

        <footer>
            <p>© 2026 JHG Top-Up BD. All rights reserved.</p>
        </footer>
    </div>

</body>
</html>
